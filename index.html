<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HomeBridge · AI post-discharge recovery hub</title>
<meta name="description" content="Concept prototype for Tata 1mg: upload every hospital paper, get one reconciled recovery plan.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --coral:#FF6F61; --coral-d:#E2543F; --coral-l:#FFF0EE; --coral-b:#FFD3CD;
  --ink:#1D2433; --ink2:#4A5468; --ink3:#7C8597; --line:#E7E4E0; --bg:#F6F4F1; --card:#fff;
  --green:#127A4B; --green-l:#E8F6EE; --blue:#2457C5; --blue-l:#EBF1FD; --amber:#A15C00; --amber-l:#FFF5E3;
  --red:#B42318; --red-l:#FEF0EE; --grey:#5B6475; --grey-l:#F1F2F4; --violet:#6B3FD1; --violet-l:#F2EEFD;
  --r:16px; --r-s:11px; --shadow:0 1px 2px rgba(29,36,51,.06),0 4px 16px rgba(29,36,51,.05);
  --font:'Inter','Noto Sans Devanagari',system-ui,-apple-system,Segoe UI,sans-serif;
}
*{box-sizing:border-box} html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--coral-d)}
.stage{min-height:100vh;display:flex;justify-content:center;gap:40px;padding:28px 24px}
.rail{width:340px;flex:none;position:sticky;top:28px;align-self:flex-start;max-height:calc(100vh - 56px);overflow:auto;padding-right:6px}
.rail .concept{display:inline-block;font-size:12px;font-weight:600;color:var(--coral-d);background:var(--coral-l);border:1px solid var(--coral-b);border-radius:99px;padding:3px 10px}
.rail h1{font-size:30px;line-height:1.1;margin:14px 0 8px;letter-spacing:-.02em}
.rail p{color:var(--ink2);margin:0 0 14px}
.rail h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin:22px 0 10px}
.pipe{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pipe li{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13.5px;color:var(--ink2)}
.pipe b{display:block;color:var(--ink);font-size:13.5px}
.pipe .ai{border-color:var(--coral-b);background:var(--coral-l)}
.aimode{display:flex;align-items:center;gap:8px;font-size:13px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ink3);flex:none}.dot.live{background:#1FA35C;box-shadow:0 0 0 4px #1fa35c22}
.rail .foot{font-size:12.5px;color:var(--ink3);margin-top:18px}
.device{width:430px;flex:none}
.app{background:var(--bg);border-radius:28px;border:1px solid var(--line);box-shadow:0 20px 60px rgba(29,36,51,.12);overflow:hidden;display:flex;flex-direction:column;height:calc(100vh - 56px);min-height:640px;position:relative}
@media (max-width:860px){.rail{display:none}.stage{padding:0}.device{width:100%}.app{border-radius:0;border:0;height:100vh;height:100dvh;min-height:0;box-shadow:none}}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;flex:1;text-align:left}
.brand b{font-size:16px;letter-spacing:-.01em}.brand small{display:block;font-size:11.5px;color:var(--ink3)}
.pill-btn{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 11px;font-size:13px;font-weight:600}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.screen{padding:18px 16px 110px}
.h1{font-size:24px;line-height:1.15;letter-spacing:-.02em;margin:4px 0 6px}
.h2{font-size:19px;letter-spacing:-.01em;margin:0 0 4px}
.sub{color:var(--ink2);margin:0 0 14px}
.small{font-size:13px}.muted{color:var(--ink3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:15.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:12px 16px;font-weight:600;font-size:15px;border:1px solid transparent;text-decoration:none}
.btn-p{background:var(--coral);color:#fff}.btn-p:hover{background:var(--coral-d)}
.btn-s{background:#fff;border-color:var(--line);color:var(--ink)}
.btn-soft{background:var(--coral-l);color:var(--coral-d);border-color:var(--coral-b)}
.btn-wa{background:#1FA35C;color:#fff}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-block{width:100%}.btn-sm{padding:7px 11px;font-size:13px;border-radius:10px}
.stack{display:grid;gap:10px}.row{display:flex;gap:10px;align-items:center}.grow{flex:1}.wrap{flex-wrap:wrap}
.dock{position:absolute;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 26%);display:flex;gap:10px;z-index:5}
.hero{background:linear-gradient(160deg,#fff 0%,var(--coral-l) 100%);border:1px solid var(--coral-b);border-radius:22px;padding:20px 18px;margin-bottom:14px}
.hero .h1{font-size:27px}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--amber-l);border:1px solid #F3D9A6;color:#6B4300;border-radius:12px;padding:10px 12px;font-size:13px}
.steps{list-style:none;padding:0;margin:14px 0;display:grid;gap:10px}
.steps li{display:flex;gap:11px;align-items:flex-start}
.steps .n{width:26px;height:26px;border-radius:50%;background:#fff;border:1px solid var(--coral-b);color:var(--coral-d);font-weight:700;font-size:13px;display:grid;place-items:center;flex:none}
.opt{display:flex;gap:12px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px;text-align:left;width:100%;margin-bottom:8px}
.opt.on{border-color:var(--coral);background:var(--coral-l)}
.opt .ic{width:38px;height:38px;border-radius:11px;background:var(--grey-l);display:grid;place-items:center;font-size:19px;flex:none}
.field{display:grid;gap:5px;margin-bottom:10px}.field label{font-size:13px;font-weight:600;color:var(--ink2)}
.field input,.field select{border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff}
.drop{border:2px dashed var(--coral-b);background:#fff;border-radius:18px;padding:22px;text-align:center;display:block;width:100%}
.drop b{display:block;font-size:16px;margin:6px 0 2px}
.files{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.fthumb{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;font-size:10.5px;line-height:1.25;position:relative;min-height:92px;display:flex;flex-direction:column;gap:4px}
.fthumb .paper-mini{height:56px;border-radius:5px;background:repeating-linear-gradient(#fff 0 6px,#E9E6E2 6px 7px);border:1px solid var(--line);overflow:hidden}
.fthumb img{height:56px;width:100%;object-fit:cover;border-radius:5px}
.fthumb .x{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:11px;line-height:1}
.progress{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.progress li{display:flex;gap:10px;align-items:center;color:var(--ink3)}
.progress li.on{color:var(--ink);font-weight:600}.progress li.done{color:var(--ink2)}
.tick{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;flex:none;background:#fff}
li.done .tick{background:var(--green);border-color:var(--green);color:#fff}
li.on .tick{border-color:var(--coral);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.doclist{display:grid;gap:6px;margin-top:12px}
.docrow{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:11px;padding:8px 10px;font-size:13.5px}
.docrow .id{font-weight:700;font-size:12px;background:var(--grey-l);border-radius:6px;padding:2px 6px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:99px;padding:3px 8px;white-space:nowrap}
.t-new{background:var(--violet-l);color:var(--violet)}.t-active{background:var(--green-l);color:var(--green)}.t-changed{background:var(--blue-l);color:var(--blue)}
.t-stopped{background:var(--grey-l);color:var(--grey)}.t-complete{background:var(--grey-l);color:var(--ink3)}.t-ask{background:var(--amber-l);color:var(--amber)}
.t-found{background:var(--green-l);color:var(--green)}.t-miss{background:var(--amber-l);color:var(--amber)}.t-yet{background:var(--blue-l);color:var(--blue)}
.t-live{background:#E7F7EE;color:#127A4B}.t-key{background:var(--grey-l);color:var(--grey)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;background:#fff;color:var(--ink2)}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.today{background:linear-gradient(150deg,var(--ink) 0%,#2E3850 100%);color:#fff;border:0}
.today .muted{color:#B9C0CF}
.slot{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid rgba(255,255,255,.12)}
.slot:first-of-type{border-top:0}
.slot .when{width:76px;flex:none;font-size:12.5px;color:#B9C0CF;padding-top:3px}
.chk{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:6px 9px;font-size:13.5px;margin-bottom:6px;width:100%;text-align:left;color:#fff}
.chk .box{width:18px;height:18px;border-radius:5px;border:1.5px solid #B9C0CF;flex:none;display:grid;place-items:center;font-size:11px}
.chk.on{opacity:.55;text-decoration:line-through}.chk.on .box{background:#1FA35C;border-color:#1FA35C}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 12px;text-align:left}
.kpi small{display:block;color:var(--ink3);font-size:12px}.kpi b{display:block;font-size:15px;margin-top:2px}.kpi span{font-size:12.5px;color:var(--coral-d);font-weight:600}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--amber-l);border:1px solid #F3D9A6;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:10px;text-align:left;width:100%}
.alert.red{background:var(--red-l);border-color:#F6C9C3;color:#7A1A12}
.med{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.med.dim{opacity:.72}
.med-top{display:flex;gap:10px;align-items:flex-start}
.med-top h4{margin:0;font-size:15.5px}.med-top small{color:var(--ink3);font-size:12.5px}
.dose{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.dchip{font-size:12px;border-radius:8px;padding:4px 8px;background:var(--grey-l);color:var(--ink2)}
.dchip.on{background:var(--coral-l);color:var(--coral-d);font-weight:700}
.note{font-size:13px;margin-top:8px;padding:7px 9px;border-radius:9px;background:var(--grey-l);color:var(--ink2)}
.note.conflict{background:var(--blue-l);color:#1C3F8F}.note.unclear{background:var(--amber-l);color:#6B4300}
.src{display:inline-flex;gap:5px;align-items:center;font-size:12px;font-weight:600;color:var(--coral-d);margin-top:8px;padding:0;text-align:left}
.src code{font-family:inherit;background:var(--coral-l);border-radius:5px;padding:1px 5px}
.group-h{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin:18px 0 8px;font-weight:700}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl:before{content:'';position:absolute;left:13px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl li{position:relative;padding:0 0 14px 38px}
.tl .ic{position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid var(--coral);display:grid;place-items:center;font-size:13px}
.tl li.past .ic{border-color:var(--line);filter:grayscale(1)}
.tl b{display:block}
.li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .em{font-size:18px;line-height:1.2;flex:none;width:24px;text-align:center}
.warn-card{background:var(--red-l);border:1px solid #F6C9C3;border-radius:14px;padding:12px;margin-bottom:12px}
.big-call{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--red);color:#fff;border-radius:12px;padding:12px;font-weight:700;font-size:16px;margin-top:10px;text-decoration:none}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t td,table.t th{padding:8px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:12px;color:var(--ink3);font-weight:600;border-top:0}
.r{text-align:right!important}
.cart-line{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.offer{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:11px;padding:8px 10px;margin-top:7px;background:#fff;font-size:13.5px}
.offer.on{border-color:var(--coral);background:var(--coral-l)}
.offer .ch{font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 6px;background:var(--grey-l)}
.offer .best{font-size:11px;font-weight:700;color:var(--green)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.stepper button{width:30px;height:30px;font-size:16px}.stepper span{min-width:44px;text-align:center;font-size:13.5px;font-weight:600}
.total{display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:700;padding-top:10px}
.chat{display:grid;gap:10px}
.bub{max-width:88%;padding:10px 12px;border-radius:14px;font-size:14px;white-space:pre-wrap}
.bub.me{justify-self:end;background:var(--ink);color:#fff;border-bottom-right-radius:4px}
.bub.ai{justify-self:start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.bub .cites{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cite{font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--coral-l);color:var(--coral-d)}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.sugg button{font-size:12.5px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 10px}
.askbar{position:absolute;left:0;right:0;bottom:62px;padding:10px 12px;background:var(--bg);border-top:1px solid var(--line);display:flex;gap:8px;z-index:6}
.askbar input{flex:1;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff}
.nav{position:absolute;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:7}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink3);padding:4px 0}
.nav button.on{color:var(--coral-d)}.nav .ni{font-size:19px;line-height:1}
.with-nav .screen{padding-bottom:150px}
.with-nav .dock{bottom:58px}
.sheet-bg{position:absolute;inset:0;background:rgba(29,36,51,.38);z-index:20;display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px 24px}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.paper{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;box-shadow:inset 0 0 0 6px #FBFAF8}
.paper mark{background:#FFE08A;border-radius:3px;padding:0 2px;box-shadow:0 0 0 2px #FFE08A}
.paper img{width:100%;border-radius:6px}
.wa{background:#E9E2D8;border-radius:16px;padding:12px;display:grid;gap:8px}
.wa .msg{background:#fff;border-radius:10px 10px 10px 2px;padding:8px 10px;font-size:13.5px;max-width:92%;white-space:pre-wrap;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.wa .msg.out{justify-self:end;background:#D9FDD3;border-radius:10px 10px 2px 10px}
.wa .meta{font-size:10.5px;color:#7a7a7a;text-align:right;margin-top:3px}
.toast{position:absolute;left:16px;right:16px;bottom:80px;background:var(--ink);color:#fff;border-radius:12px;padding:11px 14px;font-size:14px;z-index:30;text-align:center}
.prep{font-size:13.5px}.prep h4{margin:12px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3)}
.prep ul{margin:0;padding-left:18px}
.seg{display:inline-flex;background:var(--grey-l);border-radius:10px;padding:3px;gap:3px}
.seg button{padding:6px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink2)}.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.empty{text-align:center;color:var(--ink3);padding:24px 8px}
.searchbox{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;margin-bottom:10px}
.hl{background:#FFE9A8}
.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ex-row{display:flex;gap:5px;margin-top:8px}
.ex-row button{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line);font-size:13px;background:#fff}
.ex-row button.on{background:var(--green);border-color:var(--green);color:#fff}
.spinner{width:16px;height:16px;border:2px solid var(--coral-b);border-top-color:var(--coral);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
.fade{animation:fade .25s ease}@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}

/* ---------- v2 polish ---------- */
.top{background:linear-gradient(#fff,#fff) padding-box;position:relative}
.top:after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:3px;background:linear-gradient(90deg,#FF6F61,#FFB4A8 40%,#FFD9A0 70%,#9FE3C4)}
.pill-btn{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.pill-btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.hero{position:relative;overflow:hidden;background:radial-gradient(120% 80% at 100% 0%,#FFE1DC 0%,#FFF5F2 45%,#fff 100%)}
.hero-art{width:100%;height:auto;margin:-4px 0 10px}
.card{border-radius:18px}
.tab{display:inline-flex;align-items:center;gap:5px}
.tab.on{background:linear-gradient(135deg,#1D2433,#36415C);box-shadow:0 4px 12px rgba(29,36,51,.22)}
.today{background:radial-gradient(140% 120% at 100% 0%,#3A4766 0%,#1D2433 60%);box-shadow:0 12px 30px rgba(29,36,51,.28)}
.ring{position:relative;width:58px;height:58px}.ring span{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:14px}
.ring circle{transition:stroke-dashoffset .5s ease}
.chk{gap:10px;padding:8px 10px;border-radius:12px}.chk .pill{flex:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.chk b{font-weight:600}
.kpi{border-radius:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--coral)}
.med{border-radius:18px;box-shadow:var(--shadow);border-left:5px solid var(--line)}
.med.m-NEW{border-left-color:var(--violet)}.med.m-ACTIVE{border-left-color:#2FB36F}.med.m-CHANGED{border-left-color:var(--blue)}.med.m-ASK_DOCTOR{border-left-color:#E8A23A}.med.m-STOPPED,.med.m-COMPLETE{border-left-color:#C5CAD3}
.pillwrap{width:48px;height:48px;border-radius:14px;background:linear-gradient(145deg,#F6F3EF,#ECE7E1);display:grid;place-items:center;flex:none}
.purpose{font-size:13.5px;font-weight:600;color:var(--coral-d);margin-top:1px}
.looks{margin-top:8px;font-size:13px;background:#FBF8F4;border:1px dashed #E6DED4;border-radius:10px;padding:6px 9px}
.alert{border-radius:14px;box-shadow:var(--shadow)}
.nav{box-shadow:0 -6px 20px rgba(29,36,51,.06)}
.nav button.on .ni{background:var(--coral-l);border-radius:12px;padding:3px 12px}
.opt{border-radius:16px;transition:transform .12s ease}.opt:active{transform:scale(.98)}
.btn-p{background:linear-gradient(135deg,#FF7A6D,#F2554A);box-shadow:0 6px 16px rgba(242,85,74,.28)}
.rules{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rules li{display:flex;gap:11px;align-items:flex-start}
.rn{width:26px;height:26px;border-radius:9px;background:var(--ink);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;flex:none}
.rules li:first-child .rn{background:var(--red)}
/* Simple view for older users: bigger text, fewer technical details */
.app.simple{font-size:17.5px}
.simple .tech,.simple .tag.t-live,.simple .tag.t-key{display:none!important}
.simple .h1{font-size:28px}.simple .med h4{font-size:19px}.simple .purpose{font-size:16px}
.simple .chk{font-size:17px;padding:11px 12px}.simple .chk .pill{width:38px;height:38px}
.simple .tag{font-size:13.5px;padding:4px 10px}.simple .dchip{font-size:14px;padding:6px 10px}
.simple .small{font-size:15px}.simple .looks{font-size:15px}
.simple .tab{font-size:15px;padding:8px 14px}

</style>

// ============================================================
// HomeBridge — AI pipeline, rules engine and plan builder
// The model reads and extracts; code decides status, dates and quantities.
// ============================================================

const norm = (s = '') => String(s).toLowerCase().replace(/[^a-z0-9ऀ-ॿ%.]+/g, ' ').trim();
const squash = (s = '') => String(s).toLowerCase().replace(/\s+/g, ' ').trim();

// ---------- Normalise: name -> salt (code first, AI suggestion as fallback) ----------
function normaliseSalt(name = '', aiSalt = '') {
  const n = norm(name);
  for (const k of Object.keys(SALT_DICTIONARY).sort((a, b) => b.length - a.length)) {
    if (n.includes(k)) return { salt: SALT_DICTIONARY[k], matched: 'catalogue' };
  }
  const c = CATALOGUE.find((x) => n.includes(norm(x.salt)));
  if (c) return { salt: c.salt, matched: 'catalogue' };
  if (aiSalt) return { salt: aiSalt, matched: 'ai' };
  return { salt: name || 'Unknown', matched: 'none' };
}
const saltKey = (s) => norm(s).replace(/\s+/g, '');

function unitsPerDay(pattern) {
  if (!pattern) return null;
  const p = String(pattern).replace(/½/g, '0.5').split(/[-–]/).map((x) => parseFloat(x));
  if (!p.length || p.some((x) => Number.isNaN(x))) return null;
  return p.reduce((a, b) => a + b, 0);
}

function detectCondition(extractions) {
  const votes = {};
  for (const e of extractions) if (e && e.condition) votes[e.condition] = (votes[e.condition] || 0) + 1;
  const best = Object.entries(votes).sort((a, b) => b[1] - a[1])[0];
  if (best && JOURNEYS[best[0]]) return best[0];
  const text = squash(extractions.map((e) => JSON.stringify(e?.diagnosis || [])).join(' '));
  if (/tongue|oral|glossectomy|head and neck|larynx|buccal/.test(text)) return 'head_neck_cancer';
  if (/myocardial|angioplasty|stemi|coronary|heart attack|ptca/.test(text)) return 'heart_attack';
  return 'general';
}

// ---------- Reconcile: build the one current plan from every document ----------
function buildPlan(docs, extractions, home, journeyKey) {
  const byId = Object.fromEntries(docs.map((d) => [d.id, d]));
  const ordered = docs.filter((d) => extractions[d.id]).sort((a, b) => (a.date || '').localeCompare(b.date || '') || a.id.localeCompare(b.id));
  const exOf = (d) => extractions[d.id];
  const condition = journeyKey || detectCondition(ordered.map(exOf));
  const medDocs = ordered.filter((d) => (exOf(d).medicines || []).length);
  const newestMedDoc = medDocs[medDocs.length - 1];

  // 1. Medicines, keyed on salt; newest document wins
  const hist = {};
  for (const d of ordered) {
    for (const m of exOf(d).medicines || []) {
      const { salt, matched } = normaliseSalt(m.name, m.salt);
      const key = saltKey(salt);
      (hist[key] = hist[key] || { salt, matched, mentions: [] }).mentions.push({ ...m, doc: d.id, date: d.date });
    }
  }
  const meds = [];
  for (const key of Object.keys(hist)) {
    const { salt, matched, mentions } = hist[key];
    const last = mentions[mentions.length - 1];
    const notes = [];
    let current = null;
    for (const m of mentions) {
      if (m.action === 'stop') { current = null; continue; }
      const base = current || {};
      current = {
        ...base,
        name: m.name || base.name, form: m.form || base.form,
        strength: m.strength || base.strength,
        dose_pattern: m.dose_pattern || (m.action === 'continue' ? base.dose_pattern : null) || (m.sos ? null : base.dose_pattern),
        timing: m.timing || base.timing,
        sos: !!m.sos, then_sos: !!m.then_sos, long_term: !!m.long_term || (m.action === 'continue' && base.long_term),
        duration_days: m.action === 'continue' ? (m.duration_days ?? base.duration_days ?? null) : (m.duration_days ?? null),
        start: m.action === 'continue' && base.start ? base.start : m.date,

// ---------- Gaps: compare the plan with the condition's checklist ----------

// ---------- Cart: only what is missing, cheapest same salt and strength ----------

    if (m.sos) { sos.push({ med: m, have, opts }); continue; }
    const days = m.long_term || !m.duration_days ? horizon : Math.min(horizon, Math.max(0, m.daysLeft ?? horizon));
    if (!opts.length) { lines.push({ med: m, days, note: 'not_in_catalogue', have }); continue; }

// ---------- Today and reminders ----------

// ---------- Retrieval for "Ask your documents" (RAG) ----------

    parts.forEach((p, i) => chunks.push({ id: `${d.id}·${i + 1}`, doc: d.id, title: d.title, date: d.date, text: p, toks: tokenize(p) }));

const EXTRACT_PROMPT = `You read ONE hospital document for HomeBridge, an app that helps a family follow the plan after discharge. You do not give medical advice; you copy what the paper says into JSON.
Today is ${T_ISO}. Return ONLY JSON with exactly this shape:

"patient":{"name":string|null,"age_sex":string|null,"reg_no":string|null,"allergies":string|null}|null,
"diagnosis":[{"text":string,"quote":string}],"treatment":[{"text":string,"quote":string}],
"medicines":[{"name":string,"salt":string|null,"strength":string|null,"form":"tablet|capsule|mouthwash|gel|powder|syrup|injection|other","dose_pattern":"1-0-1"|null,"timing":string|null,"duration_days":number|null,"long_term":boolean,"sos":boolean,"then_sos":boolean,"action":"start|continue|stop|change","quote":string}],
"visits":[{"department":string,"due_in_days":number|null,"due_date":"YYYY-MM-DD"|null,"quote":string}],

"results":[{"test":string,"value":string,"flag":"low|high|normal|good|attention","quote":string}],
"diet":[{"en":string,"hi":string,"quote":string}],"precautions":[{"en":string,"hi":string,"quote":string}],
"exercises":[{"en":string,"hi":string,"freq_per_day":number|null,"quote":string}],"warning_signs":[{"en":string,"hi":string,"quote":string}],

  const text = await AI.ask(prompt, images, 'default');
  const j = parseJSON(text);
  for (const k of ['diagnosis', 'treatment', 'medicines', 'visits', 'tests', 'results', 'diet', 'precautions', 'exercises', 'warning_signs', 'bills', 'contacts']) if (!Array.isArray(j[k])) j[k] = [];
  // Guard: quotes must exist in the text we have; unverifiable items are flagged, never silently trusted
  if (doc.text) {
    const body = squash(doc.text);
    for (const k of ['medicines', 'visits', 'tests']) for (const it of j[k]) it.quote_verified = !!it.quote && body.includes(squash(it.quote).slice(0, 40));
  }
  return j;
}

async function askLive(question, hits, plan, lang) {
  const ctx = hits.map((h) => `[${h.c.doc}] (${h.c.title}, ${paperDate(h.c.date)})\n${h.c.text}`).join('\n\n');
  const planBrief = JSON.stringify({
    medicines: plan.meds.map((m) => ({ name: m.name, status: m.status, dose: m.dose_pattern, sos: m.sos, timing: m.timing, from: m.source.doc })),
    upcoming: plan.timeline.filter((x) => x.due >= T_ISO).map((x) => ({ what: x.name, due: x.due, from: x.source.doc })),
  });
  const prompt = `You answer a family's question using ONLY their own hospital papers below and the reconciled plan. Today is ${T_ISO}.
Rules: answer in ${lang === 'hi' ? 'simple Hindi (Devanagari)' : 'plain English'}, at most 4 short sentences. After each fact put its source in square brackets like [D3]. If the papers do not answer it, reply exactly "NOT_IN_PAPERS". Never give medical advice, never suggest changing, starting or stopping a medicine; if asked, say it is a question for the doctor.
PLAN: ${planBrief}
PAPERS:
${ctx}
QUESTION: ${question}`;
  return (await AI.ask(prompt, [], 'quick')).trim();
}

// Offline answer: plan-aware shortcuts plus the best matching lines
function answerOffline(question, hits, plan, lang) {
  const q = norm(question);
  const L = (en, hi) => (lang === 'hi' ? hi : en);
  const fmt = (iso) => fmtDate(iso, lang);
  if (/pet|scan|स्कैन/.test(q)) { const t = plan.tests.find((x) => /pet|scan/i.test(x.name)); if (t) return { text: L(`The PET-CT is due on ${fmt(t.due)} [${t.source.doc}].`, `PET-CT ${fmt(t.due)} को होना है [${t.source.doc}]।`), cites: [t.source.doc] }; }
  if (/thyroid|tsh|थायराइड/.test(q)) { const t = plan.tests.find((x) => /tsh/i.test(x.name)); if (t) return { text: L(`The next thyroid test (TSH) is due on ${fmt(t.due)}, 6 months after the last one [${t.source.doc}${t.basis ? ', ' + t.basis.doc : ''}].`, `अगला थायराइड टेस्ट (TSH) ${fmt(t.due)} को है [${t.source.doc}]।`), cites: [t.source.doc] }; }
  if (/bill|cost|spen|money|paid|claim|खर्च|बिल/.test(q)) { const tot = plan.bills.reduce((s, b) => s + b.amount, 0); return { text: L(`Your papers show ${plan.bills.length} bills totalling ₹${inr(tot)} [${[...new Set(plan.bills.map((b) => b.doc))].join(', ')}].`, `आपके कागज़ों में ${plan.bills.length} बिल हैं, कुल ₹${inr(tot)}।`), cites: plan.bills.map((b) => b.doc) }; }
  if (/next (visit|appointment|opd)|doctor|डॉक्टर/.test(q)) { const v = plan.timeline.find((x) => x.kind === 'visit' && x.due >= T_ISO); if (v) return { text: L(`The next visit is ${v.name} on ${fmt(v.due)} [${v.source.doc}].`, `अगली विज़िट ${v.name}, ${fmt(v.due)} को [${v.source.doc}]।`), cites: [v.source.doc] }; }
  const terms = new Set([...expandQuery(question).base, ...expandQuery(question).extra]);
  const medHits = plan.meds.filter((m) => ['ACTIVE', 'NEW', 'CHANGED'].includes(m.status) && tokenize(`${m.name} ${m.form || ''} ${m.salt}`).some((w) => terms.has(w)));
  if (medHits.length) return { text: medHits.map((m) => L(`${m.name}: ${m.sos ? 'only when needed (SOS)' : m.dose_pattern}${m.timing ? ', ' + m.timing : ''}${m.daysLeft ? `, ${m.daysLeft} days left` : m.long_term ? ', long term' : ''} [${m.source.doc}].`, `${m.name}: ${m.sos ? 'ज़रूरत होने पर (SOS)' : m.dose_pattern}${m.timing ? ', ' + m.timing : ''} [${m.source.doc}]।`)).join(' '), cites: medHits.map((m) => m.source.doc) };
  if (!hits.length) return { text: 'NOT_IN_PAPERS', cites: [] };
  const top = hits[0].c;
  const base = tokenize(question).filter((w) => !['next', 'when', 'what', 'say', 'said', 'tell'].includes(w));
  const covered = base.filter((w) => top.toks.some((x) => x === w || x.startsWith(w)) || (SYNONYMS[w] || []).some((s) => top.toks.includes(norm(s)))).length;
  if (base.length && covered / base.length < 0.6) return { text: 'NOT_IN_PAPERS', cites: [] };
  const line = top.text.split('\n').find((l) => tokenize(l).some((w) => tokenize(question).includes(w))) || top.text.split('\n')[0];
  return { text: L(`Closest line in your papers: “${line.trim()}” [${top.doc}]`, `आपके कागज़ों में सबसे मिलती लाइन: “${line.trim()}” [${top.doc}]`), cites: [top.doc] };
}

// Golden check: compare a live plan's medicine statuses with the saved answer key
function compareWithKey(livePlan, keyPlan) {
  let match = 0, total = 0; const diffs = [];
  for (const k of keyPlan.meds) {
    total++;
    const l = livePlan.meds.find((m) => m.key === k.key);
    if (l && l.status === k.status) match++; else diffs.push({ name: k.name, key: k.status, live: l ? l.status : 'missing' });
  }
  return { match, total, diffs };
}

function inr(n) { return Number(n).toLocaleString('en-IN'); }
function fmtDate(iso, lang = 'en') {
  if (!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString(lang === 'hi' ? 'hi-IN' : 'en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
}
function relDays(iso, lang = 'en') {
  const n = daysBetween(T_ISO, iso);
  if (lang === 'hi') return n === 0 ? 'आज' : n === 1 ? 'कल' : n > 0 ? `${n} दिन में` : `${-n} दिन पहले`;
  return n === 0 ? 'today' : n === 1 ? 'tomorrow' : n > 0 ? `in ${n} days` : `${-n} days ago`;
}

  const c = (look && look.color) || '#EDEFF3', st = '#1D2433', sh = (look && look.shape) || 'round', hl = 'rgba(255,255,255,.55)';
  const inner = {
    round: `<circle cx="20" cy="20" r="11" fill="${c}" stroke="${st}" stroke-width="1.6"/><path d="M12.5 20h15" stroke="${st}" stroke-opacity=".35" stroke-width="1.2"/><ellipse cx="16" cy="15.5" rx="3" ry="1.6" fill="${hl}"/>`,
    oval: `<ellipse cx="20" cy="20" rx="14" ry="9" fill="${c}" stroke="${st}" stroke-width="1.6"/><path d="M8 20h24" stroke="${st}" stroke-opacity=".3" stroke-width="1.2"/><ellipse cx="14" cy="16" rx="4" ry="1.6" fill="${hl}"/>`,
    long: `<rect x="4" y="13" width="32" height="14" rx="7" fill="${c}" stroke="${st}" stroke-width="1.6"/><path d="M20 13v14" stroke="${st}" stroke-opacity=".35" stroke-width="1.2"/><rect x="8" y="15.5" width="9" height="2.4" rx="1.2" fill="${hl}"/>`,
    capsule: `<rect x="4" y="13" width="32" height="14" rx="7" fill="#fff" stroke="${st}" stroke-width="1.6"/><path d="M11 13h9v14h-9a7 7 0 0 1 0-14z" fill="${c}"/><path d="M20 13v14" stroke="${st}" stroke-width="1.2"/><rect x="8" y="15.5" width="7" height="2.4" rx="1.2" fill="${hl}"/>`,
    bottle: `<rect x="15" y="4" width="10" height="6" rx="2" fill="#fff" stroke="${st}" stroke-width="1.5"/><path d="M12 13a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v21a2 2 0 0 1-2 2H14a2 2 0 0 1-2-2z" fill="#fff" stroke="${st}" stroke-width="1.6"/><path d="M13 20h14v13a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 13 33z" fill="${c}"/><rect x="15" y="22" width="3" height="8" rx="1.5" fill="${hl}"/>`,
    tube: `<path d="M8 15h20l6 5-6 5H8a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2z" fill="${c}" stroke="${st}" stroke-width="1.6"/><rect x="2" y="16.5" width="4" height="7" rx="1" fill="#fff" stroke="${st}" stroke-width="1.4"/><rect x="10" y="17" width="10" height="2" rx="1" fill="${hl}"/>`,
    tin: `<ellipse cx="20" cy="11" rx="12" ry="4" fill="#fff" stroke="${st}" stroke-width="1.6"/><path d="M8 11v18c0 2.2 5.4 4 12 4s12-1.8 12-4V11" fill="${c}" stroke="${st}" stroke-width="1.6"/><rect x="11" y="17" width="3" height="10" rx="1.5" fill="${hl}"/>`,
  }[sh] || '';
  return `<svg width="${size}" height="${size}" viewBox="0 0 40 40" aria-hidden="true" class="pill">${inner}</svg>`;
}

  const P = S.plan, td = buildToday(P);
  const attn = [];
  const ask = P.meds.filter((m) => m.status === 'ASK_DOCTOR' || m.needs_clarification);
  if (ask.length) attn.push(`<button class="alert" data-a="tab" data-k="meds">❓ <span><b>${ask.length} ${esc(L('medicines need a doctor’s answer', 'दवाओं पर डॉक्टर से पूछना है'))}</b><br>${esc(ask.map((m) => m.name).join(', '))}</span></button>`);
  const gaps = P.gaps.items.filter((i) => i.status === 'NOT_FOUND');
  if (gaps.length) attn.push(`<button class="alert" data-a="go" data-to="checklist">📋 <span><b>${gaps.length} ${esc(L('checklist items not in your papers', 'चेकलिस्ट बातें कागज़ों में नहीं'))}</b><br>${esc(gaps.map((g) => L(g.en, g.hi)).join(', '))}</span></button>`);

async function doAsk(q) {
  q = q.trim(); if (!q) return;
  S.chat.push({ role: 'me', text: q });
  if (ADVICE_RE.test(q)) { S.chat.push({ role: 'ai', text: t('adviceNo'), addQ: q }); if (!S.visitQs.includes(q)) S.visitQs.push(q); render(); return; }
  const hits = search(S.index, q, 5);
  const msg = { role: 'ai', pending: true }; S.chat.push(msg); render();
  let text, cites = [];
  if (AI.live) {
    try {
      text = await askLive(q, hits, S.plan, S.lang);
      const ids = [...new Set((text.match(/\[(D\d+|U\d+)[^\]]*\]/g) || []).map((x) => x.match(/D\d+|U\d+/)[0]))];

    } catch (e) { text = null; }
  }
  if (!text) { const r = answerOffline(q, hits, S.plan, S.lang); text = r.text; cites = [...new Set(r.cites)].map((id) => ({ doc: id, quote: hits.find((h) => h.c.doc === id)?.c.text.split('\n')[0] || '' })); msg.mode = L('Offline answer: plan + keyword search', 'ऑफ़लाइन जवाब'); }
  if (text.includes('NOT_IN_PAPERS')) { text = t('notIn'); cites = []; msg.addQ = q; }

}

// ---------------- Files ----------------
let upCount = 0;
async function addFiles(files) {
  for (const f of files.slice(0, 15)) {
    if (f.size > 8 * 1024 * 1024) { toast(L(`${f.name} is over 8 MB`, `${f.name} 8 MB से बड़ी है`)); continue; }
    const id = 'U' + (++upCount);
    const doc = { id, title: f.name.replace(/\.[^.]+$/, '').slice(0, 40), date: T_ISO, type: 'other', text: '', images: [], thumb: null };
    try {
      if (/^image\//.test(f.type)) { const { blob, url } = await shrinkImage(f); doc.images = [blob]; doc.thumb = url; }
      else if (f.type === 'application/pdf') { const r = await readPdf(f); doc.text = r.text; doc.images = r.images; doc.thumb = r.thumb; }
      else doc.text = await f.text();
    } catch (e) { toast(L(`Could not open ${f.name}. Try a photo instead.`, `${f.name} नहीं खुली। फोटो आज़माएं।`)); continue; }
    S.docs.push(doc);
  }
  S.index = buildIndex(S.docs);
  render();
}
function shrinkImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { const sc = Math.min(1, 1600 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); c.toBlob((b) => res({ blob: b, url: c.toDataURL('image/jpeg', 0.6) }), 'image/jpeg', 0.85); };
    img.onerror = rej; img.src = url;
  });
}
let pdfjsReady = null;
function loadPdfJs() {
  if (pdfjsReady) return pdfjsReady;
  pdfjsReady = new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'; s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; res(window.pdfjsLib); }; s.onerror = rej; document.head.appendChild(s); });
  return pdfjsReady;
}
async function readPdf(file) {
  const lib = await loadPdfJs();
  const pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  let text = ''; const images = []; let thumb = null;
  for (let p = 1; p <= Math.min(pdf.numPages, 6); p++) {
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    let lastY = null; for (const it of tc.items) { const y = it.transform[5]; text += (lastY !== null && Math.abs(y - lastY) > 4 ? '\n' : ' ') + it.str; lastY = y; }
    text += '\n\n';
    if (p <= 3) {
      const vp = page.getViewport({ scale: 1.6 }); const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
      await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
      images.push(await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.85)));
      if (!thumb) thumb = c.toDataURL('image/jpeg', 0.5);
    }
  }
  return { text: text.replace(/[ \t]+/g, ' ').trim().length > 80 ? text.trim() : '', images, thumb };
}

// ---------------- Processing (S3) ----------------
async function runProcessing() {
  const todo = S.docs.filter((d) => !S.extractions[d.id]);
  const useLive = AI.live && (S.useLive || todo.some((d) => !d.sample));
  S.proc = { step: 0, files: {}, live: useLive && AI.live, secs: 0, finished: false, cancel: false };
  go('reading');
  const timer = setInterval(() => { S.proc.secs++; if (S.screen === 'reading') render(); }, 1000);
  const advance = (n) => { S.proc.step = Math.max(S.proc.step, n); render(); };
  await new Promise((r) => setTimeout(r, 500)); advance(1);
  const live = {};
  const work = async (d) => {
    if (useLive && !S.proc.cancel && (!d.sample || S.useLive)) {
      try { live[d.id] = await extractLive(d); S.proc.files[d.id] = { state: 'done', src: 'live', type: live[d.id].doc_type, date: live[d.id].doc_date || d.date }; render(); return; }
      catch (e) { S.proc.error = L(`Live AI could not read ${d.id} (${String(e.message || e).slice(0, 80)}).`, `लाइव AI ${d.id} नहीं पढ़ पाया।`); }
    }
    if (d.sample) { S.proc.files[d.id] = { state: 'done', src: 'key', type: CACHED_EXTRACTIONS[d.id].doc_type, date: d.date }; }
    else S.proc.files[d.id] = { state: 'skip' };
    render();
  };
  advance(2);
  const queue = todo.slice(); const workers = Array.from({ length: useLive ? 4 : 1 }, async () => { while (queue.length) { const d = queue.shift(); if (!useLive) await new Promise((r) => setTimeout(r, 180)); await work(d); } });
  await Promise.all(workers);
  advance(3); await new Promise((r) => setTimeout(r, 400));
  // merge: live result where we have it, else the answer key for sample papers
  for (const d of todo) {
    if (live[d.id]) { S.extractions[d.id] = live[d.id]; S.sourceOf[d.id] = 'live'; if (live[d.id].doc_date) d.date = live[d.id].doc_date; d.type = live[d.id].doc_type || d.type; if (!d.sample && live[d.id].doc_type) d.title = (DOC_TYPE_LABEL[live[d.id].doc_type]?.en || d.title); }
    else if (d.sample) { S.extractions[d.id] = CACHED_EXTRACTIONS[d.id]; S.sourceOf[d.id] = 'key'; }
  }
  advance(4); await new Promise((r) => setTimeout(r, 400));
  const condition = S.condition === 'auto' ? null : S.condition;
  S.plan = buildPlan(S.docs, S.extractions, S.home, condition);
  if (S.docs.every((d) => d.sample) && Object.values(S.sourceOf).includes('live')) {
    S.keyPlan = buildPlan(S.docs, CACHED_EXTRACTIONS, S.home, condition);
    S.golden = compareWithKey(S.plan, S.keyPlan);
  }
  S.index = buildIndex(S.docs);
  if (!S.dates.discharge) { const ds = S.docs.find((d) => (S.extractions[d.id]?.doc_type) === 'discharge_summary'); if (ds) S.dates.discharge = ds.date; }
  advance(5); S.proc.finished = true; clearInterval(timer);
  await new Promise((r) => setTimeout(r, 600));
  if (S.screen === 'reading') go('checklist');
}

// ---------------- Files out: downloads capability, else a normal download, else copy ----------------
async function saveFile(filename, data, mime) {
  try {
    if (window.claude && window.claude.use) { const dl = await window.claude.use('downloads'); if (dl) { await dl.save({ filename, data }); toast(L('Saved', 'सेव हुआ')); return; } }
  } catch (e) { if (e && e.code === 'declined') return; }
  try {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: mime })); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); return;
  } catch (e) { /* sandboxed */ }
  try { await navigator.clipboard.writeText(data); toast(L('Download is blocked here, so I copied it instead.', 'डाउनलोड रुका है, इसलिए कॉपी कर दिया।')); } catch (e) { toast(L('Could not save the file here.', 'फ़ाइल यहां सेव नहीं हो सकी।')); }
}

// ---------------- Actions ----------------
function loadSample() {
  S.docs = SAMPLE_DOCS.map((d) => ({ ...d, sample: true }));
  S.home = SAMPLE_HOME.map((h) => ({ ...h }));
  S.isSample = true; S.dates = { discharge: D.d1, treatEnd: RT_END };
  S.index = buildIndex(S.docs);
}
const ACTIONS = {
  home: () => go(S.plan ? 'plan' : 'landing'),
  lang: () => { S.lang = S.lang === 'en' ? 'hi' : 'en'; render(); },
  simple: () => { S.simple = !S.simple; render(); },
  go: (el) => { if (el.dataset.to === 'plan' && S.screen === 'plan') { S.tab = 'today'; } go(el.dataset.to); },
  sample: () => { S.condition = 'auto'; loadSample(); go('upload'); },
  loadSample: () => { loadSample(); render(); },
  cond: (el) => { S.condition = el.dataset.k; render(); },
  rmdoc: (el) => { S.docs = S.docs.filter((d) => d.id !== el.dataset.id); render(); },
  process: () => runProcessing(),
  skipLive: () => { S.proc.cancel = true; S.useLive = false; render(); },
  tab: (el) => { if (S.screen !== 'plan') S.screen = 'plan'; S.tab = el.dataset.k; render(); },
  tick: (el) => { S.ticks[el.dataset.k] = !S.ticks[el.dataset.k]; render(); },
  extick: (el) => { S.exTicks[el.dataset.k] = !S.exTicks[el.dataset.k]; render(); },
  src: (el) => { const r = S.srcReg[Number(el.dataset.i)]; if (r) { S.sheet = { kind: 'doc', doc: r.doc, quote: r.quote }; render(); } },
  opendoc: (el) => { S.sheet = { kind: 'doc', doc: el.dataset.id, quote: S.vaultQ ? (search(S.index, S.vaultQ, 1)[0]?.c.text.split('\n').find((l) => tokenize(l).some((w) => tokenize(S.vaultQ).includes(w))) || '') : '' }; render(); },
  close: () => { S.sheet = null; render(); },
  more: () => { S.sheet = { kind: 'more' }; render(); },
  restart: () => { Object.assign(S, { screen: 'landing', docs: [], extractions: {}, sourceOf: {}, plan: null, keyPlan: null, golden: null, home: [], tab: 'today', pick: {}, ticks: {}, exTicks: {}, chat: [], visitQs: [], sheet: null, proc: null, condition: 'auto', dates: { discharge: '', treatEnd: '' }, vaultSel: {}, vaultQ: '' }); upCount = 0; render(); },
  addq: (el) => { const q = el.dataset.q; if (!S.visitQs.includes(q)) S.visitQs.push(q); toast(L('Added to visit questions', 'पूछने की सूची में जोड़ा')); },
  qty: (el) => { const h = S.home[Number(el.dataset.i)]; const step = h.unit === 'tablets' || h.unit === 'capsules' ? 1 : 0.5; h.qty = Math.max(0, Math.round((h.qty + step * Number(el.dataset.d)) * 10) / 10); S.plan = buildPlan(S.docs, S.extractions, S.home, S.condition === 'auto' ? null : S.condition); render(); },
  addmed: () => { const v = document.getElementById('newmed').value.trim(); if (!v) return; S.home.push({ name: v, salt: normaliseSalt(v).salt, qty: 10, unit: 'tablets' }); S.plan = buildPlan(S.docs, S.extractions, S.home, S.condition === 'auto' ? null : S.condition); render(); },
  pick: (el) => { S.pick[el.dataset.k] = Number(el.dataset.i); render(); },
  order: (el) => { S.sheet = { kind: 'order', id: 100000 + Math.floor(Math.random() * 899999), total: Number(el.dataset.total) }; render(); },
  askq: (el) => doAsk(el.dataset.q),
  icsAll: () => saveFile('homebridge-reminders.ics', buildICS(buildReminders(S.plan, buildCart(S.plan, S.home))), 'text/calendar'),
  ics1: (el) => saveFile('homebridge-' + el.dataset.name.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.ics', buildICS([{ kind: 'visit', date: el.dataset.due, title: el.dataset.name }]), 'text/calendar'),
  copyPrep: async () => { const pt = prepText(); const txt = pt.sections.map(([h, it]) => it.length ? `${h.toUpperCase()}\n${it.map((x) => '- ' + x).join('\n')}` : '').filter(Boolean).join('\n\n'); try { await navigator.clipboard.writeText(txt); toast(t('copied')); } catch (e) { toast(L('Copy is blocked here.', 'कॉपी यहां रुका है।')); } },
  dlPrep: () => { const pt = prepText(); const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Visit prep</title></head><body style="font-family:sans-serif;max-width:720px;margin:24px auto"><h1>Visit prep — HomeBridge</h1>${pt.next ? `<p><b>${pt.next.name}</b>, ${fmtDate(pt.next.due)}</p>` : ''}${pt.sections.map(([h, it]) => it.length ? `<h3>${h}</h3><ul>${it.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : '').join('')}<p style="color:#888">Synthetic demo data. Generated ${fmtDate(T_ISO)}.</p></body></html>`; saveFile('visit-prep.html', html, 'text/html'); },
  vtype: (el) => { S.vaultType = el.dataset.k; render(); },
  pack: () => { const ids = Object.keys(S.vaultSel).filter((k) => S.vaultSel[k]); const txt = ids.map((id) => { const d = docOf(id); return `===== ${d.id} · ${d.title} · ${fmtDate(d.date)} =====\n${d.text || '[image]'}`; }).join('\n\n'); saveFile('homebridge-papers.txt', txt, 'text/plain'); },
};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  if (el.dataset.a === 'close' && e.target.closest('.sheet') && !e.target.closest('button[data-a="close"]')) return;
  const fn = ACTIONS[el.dataset.a]; if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('submit', (e) => { const f = e.target.closest('[data-form="ask"]'); if (!f) return; e.preventDefault(); const i = document.getElementById('askin'); const q = i.value; i.value = ''; doAsk(q); });
document.addEventListener('input', (e) => {
  const k = e.target.dataset.in; if (!k) return;
  if (k === 'vaultQ') { S.vaultQ = e.target.value; const pos = e.target.selectionStart; render(); const n = document.querySelector('[data-in="vaultQ"]'); n.focus(); n.setSelectionRange(pos, pos); }
});
document.addEventListener('change', (e) => {
  const k = e.target.dataset.in; if (!k) return;
  if (k === 'dDis') S.dates.discharge = e.target.value; else if (k === 'dEnd') S.dates.treatEnd = e.target.value;
  else if (k === 'useLive') S.useLive = e.target.checked;
  else if (k === 'rPat') S.reminderFor.patient = e.target.checked; else if (k === 'rCare') S.reminderFor.caregiver = e.target.checked;
  else if (k === 'vsel') S.vaultSel[e.target.dataset.id] = e.target.checked;
  if (k !== 'vsel') render();
});

render();
AI.init().then(() => { S.useLive = AI.live; render(); });

// ---------- Transparency: how HomeBridge decides ----------
function scrRules() {
  const nChunks = S.index ? S.index.N : 0;
  const kb = [
    ['🗂️', L('Your own papers (the vault)', 'आपके अपने कागज़'), L(`${S.docs.length} papers split into ${nChunks} searchable passages. The only source for answers.`, `${S.docs.length} कागज़, ${nChunks} खोजने लायक हिस्से। जवाब सिर्फ इन्हीं से।`)],
    ['💊', L('Medicine catalogue', 'दवा कैटलॉग'), L(`${CATALOGUE.length} products with pack sizes and illustrative prices (1mg online, Jan Aushadhi, local chemist).`, `${CATALOGUE.length} दवाएं, पैक और उदाहरण कीमतें।`)],
    ['🔤', L('Brand-to-salt dictionary', 'ब्रांड से सॉल्ट'), L(`${Object.keys(SALT_DICTIONARY).length} brand and generic names mapped to their salt, so “Dolo” and “Paracetamol” count as one medicine.`, `${Object.keys(SALT_DICTIONARY).length} नाम, ताकि Dolo और Paracetamol एक ही गिने जाएं।`)],
    ['🟡', L('Medicine guide', 'दवा गाइड'), L(`${Object.keys(MED_INFO).length} medicines with what they are for and what they look like (“white long tablet”).`, `${Object.keys(MED_INFO).length} दवाएं: किसलिए हैं और कैसी दिखती हैं।`)],
    ['📋', L('Condition checklists', 'बीमारी की चेकलिस्ट'), L(`${Object.keys(JOURNEYS).length} templates (${Object.values(JOURNEYS).map((j) => j.items.length).join(' + ')} items) written from published patient guidelines.`, `${Object.keys(JOURNEYS).length} चेकलिस्ट, प्रकाशित गाइडलाइन से।`)],
    ['🔁', L('Synonyms, English and Hindi', 'पर्यायवाची, अंग्रेज़ी और हिंदी'), L(`${Object.keys(SYNONYMS).length} word groups, e.g. gargle = mouthwash, थायराइड = TSH.`, `${Object.keys(SYNONYMS).length} शब्द-समूह, जैसे कुल्ला = mouthwash।`)],
  ];
  const planRules = [
    [L('Safety rules always win', 'सुरक्षा नियम सबसे ऊपर'), L('Never invent a medicine, dose, date or test. Stop a medicine only when a paper says so. Anything unclear goes to “Ask doctor”. No diagnosis or dose advice.', 'कुछ भी गढ़ा नहीं जाता। दवा तभी बंद जब कागज़ पर लिखा हो। जो साफ नहीं, वह “डॉक्टर से पूछें” में।')],
    [L('The paper’s own words', 'कागज़ पर लिखा शब्द'), L('Every item must carry a word-for-word quote from its page. A written instruction beats the AI’s reading of it.', 'हर बात के साथ कागज़ की हूबहू लाइन। लिखा हुआ, AI की समझ से ऊपर।')],
    [L('Newest paper wins', 'नया कागज़ मान्य'), L('For the same medicine (matched by salt), the most recent dated paper decides. Example: D3 restarted Pantoprazole, newer D4 stops it, so it is stopped.', 'एक ही दवा पर सबसे नई तारीख वाला कागज़ फैसला करता है।')],
    [L('Duration on the paper', 'कागज़ पर लिखी अवधि'), L('“x 30 days” ends the course; “long term” keeps it; “SOS” means only when needed. No duration = flagged, and 30 days is assumed only for buying.', '“x 30 दिन” पर कोर्स खत्म; “long term” चालू; “SOS” ज़रूरत पर।')],
    [L('Medicine box at home', 'घर का दवा डिब्बा'), L('Only reduces what you need to buy. It never adds a medicine to the plan; a box item on no paper goes to “Ask doctor”.', 'सिर्फ खरीदने की मात्रा घटाता है; योजना में दवा नहीं जोड़ता।')],
    [L('Condition checklist', 'बीमारी की चेकलिस्ट'), L('Only creates questions for the doctor, never instructions.', 'सिर्फ डॉक्टर के लिए सवाल बनाती है, निर्देश नहीं।')],
  ];
  const askRules = [
    [L('Advice check first', 'पहले सलाह की जांच'), L('Questions about stopping, skipping or changing a dose are not answered. They go to your visit questions.', 'दवा बंद/बदलने के सवालों का जवाब नहीं, वे डॉक्टर की सूची में।')],
    [L('The plan next', 'फिर योजना'), L('Dates, current medicines and bill totals come from the reconciled plan.', 'तारीख, चालू दवाएं, बिल योजना से।')],
    [L('Then search your pages', 'फिर कागज़ों में खोज'), L('Each passage is scored; the top 5 go to the AI, which may answer only from them and must cite the paper, like [D3].', 'हर हिस्से को अंक; टॉप 5 से ही जवाब, हवाले के साथ।')],
    [L('No match, no answer', 'मेल नहीं तो जवाब नहीं'), L('If the best passage covers less than 60% of your question’s words, the answer is “Not in your papers”.', '60% से कम मेल पर “कागज़ों में नहीं”।')],
  ];
  const weights = [
    [L('Exact word from your question', 'सवाल का हूबहू शब्द'), '1.0'], [L('Synonym (gargle → mouthwash)', 'पर्यायवाची'), '0.6'],
    [L('Newer page boost', 'नए कागज़ को बढ़त'), L('up to +25%, halves in ~30 days', '+25% तक')], [L('Keyword scoring (BM25)', 'कीवर्ड स्कोर (BM25)'), 'k1 1.4 · b 0.75'],
    [L('Passages sent to the AI', 'AI को भेजे हिस्से'), '5'], [L('Minimum match to answer', 'जवाब के लिए न्यूनतम मेल'), '60%'],
    [L('Cart choice', 'कार्ट का चुनाव'), L('same salt + strength, then lowest total', 'वही सॉल्ट और ताकत, फिर सबसे सस्ता')], [L('AI temperature for extraction', 'AI तापमान'), '0'],
  ];
  const ol = (rows) => `<ol class="rules">${rows.map(([h, b], i) => `<li><span class="rn">${i + 1}</span><div><b>${esc(h)}</b><div class="small muted">${esc(b)}</div></div></li>`).join('')}</ol>`;
  return `<div class="screen fade"><div class="h1">${esc(t('rulesT'))}</div><p class="sub">${esc(L('What the AI looks things up in, which rule wins when two disagree, and the weights used to pick answers.', 'AI कहां से देखता है, कौन सा नियम ऊपर है, और जवाब चुनने के वज़न।'))}</p>
    <div class="group-h">${esc(L('Knowledge bases', 'ज्ञान-स्रोत'))}</div><div class="card">${kb.map(([ic, h, b]) => `<div class="li"><span class="em">${ic}</span><div><b>${esc(h)}</b><div class="small muted">${esc(b)}</div></div></div>`).join('')}</div>
    <div class="group-h">${esc(L('Building the plan: rules in priority order', 'योजना बनाने के नियम, प्राथमिकता से'))}</div><div class="card">${ol(planRules)}</div>
    <div class="group-h">${esc(L('Answering a question', 'सवाल का जवाब'))}</div><div class="card">${ol(askRules)}</div>
    <div class="group-h">${esc(L('Weights and thresholds', 'वज़न और सीमाएं'))}</div><div class="card"><table class="t">${weights.map(([a, b]) => `<tr><td>${esc(a)}</td><td class="r"><b>${esc(b)}</b></td></tr>`).join('')}</table></div>
  </div>`;
}

</script>
